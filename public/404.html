<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Qua Japan | Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 back to root index.html preserving path and query/hash
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var repoName = l.pathname.split('/')[1];
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        (repoName ? '/' + repoName : '') + '/?' +
        (l.pathname.slice(1) ? 'p=' + encodeURIComponent(l.pathname.slice(1)) : '') +
        (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to Qua Japan portal...</p>
  </body>
</html>
